# Retained for parity; the platform routes directly to Service app:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - wingman.cnh.radarhq.io
  rules:
    - backendRefs:
        - name: app
          port: 80

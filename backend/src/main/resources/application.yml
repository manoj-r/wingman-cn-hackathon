server:
  address: ${BACKEND_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: conference-wingman-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wingman}
    username: ${DATABASE_USERNAME:wingman}
    password: ${DATABASE_PASSWORD:}
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
wingman:
  version: ${APP_VERSION:local}
  rate-limit:
    introductions-per-minute: 5
    match-retries-per-minute: 2
    trusted-proxies: ${WINGMAN_RATE_LIMIT_TRUSTED_PROXIES:}
  embedding:
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    dimensions: ${EMBEDDING_DIMENSIONS:0}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: 15s
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    api-key: ${ELASTICSEARCH_API_KEY:}
  matching:
    max-attempts: 3
    poll-ms: 1000
logging:
  level:
    # PostgreSQL constraint diagnostics include private email/idempotency values.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

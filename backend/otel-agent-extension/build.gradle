plugins {
    id 'java-library'
}

group = 'io.conferencewingman'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencies {
    compileOnly 'io.opentelemetry:opentelemetry-api:1.67.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk:1.67.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.67.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { archiveFileName = 'wingman-otel-agent-extension.jar' }
